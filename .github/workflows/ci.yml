# ============================================================
# CI — Lint e Testes
# ============================================================
# Roda em push/PR para garantir qualidade do código.
# ============================================================

name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-ci-v1
          restore-keys: |
            ${{ runner.os }}-r-ci-

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c(
            "testthat",
            "plumber",
            "jsonlite",
            "digest",
            "forecast",
            "lintr"
          ), repos = "https://cloud.r-project.org")'

      - name: Lint R code
        run: |
          Rscript -e '
            library(lintr)
            results <- lint_dir("R/", linters = linters_with_defaults(
              line_length_linter(120),
              object_name_linter = NULL
            ))
            if (length(results) > 0) {
              print(results)
              cat("\n", length(results), "lint issues found.\n")
            } else {
              cat("No lint issues found.\n")
            }
          '

      - name: Run tests
        run: |
          Rscript -e '
            library(testthat)
            results <- test_dir("tests/", reporter = "summary")
          '
