# ============================================================
# Refresh — Cron de Atualização de Dados
# ============================================================
# Roda semanalmente (segunda-feira 06:00 UTC) para atualizar
# o snapshot de dados do SINESP.
# Também pode ser disparado manualmente.
# ============================================================

name: Data Refresh

on:
  schedule:
    # Toda segunda-feira às 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar refresh mesmo se snapshot existir"
        required: false
        default: "false"

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-refresh-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-refresh-

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c(
            "jsonlite",
            "digest",
            "dplyr",
            "BrazilCrime"
          ), repos = "https://cloud.r-project.org")'

      - name: Run refresh pipeline
        run: |
          Rscript R/refresh.R

      - name: Upload snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 30

      - name: Commit snapshot (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh data snapshot [automated]"
            git push
          fi
